<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scanner - Demon Fest</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #ff5e00;
            font-size: 32px;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 25px auto;
        }

        .resultado {
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .valido {
            background: #073d22;
            border: 2px solid #00ff88;
        }

        .invalido {
            background: #3d0707;
            border: 2px solid red;
        }

        .usado {
            background: #3d3200;
            border: 2px solid #ffd000;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        #marcarUsado {
            background: #00ff88;
            color: black;
            display: none;
        }

        #nuevoEscaneo {
            background: #ff5e00;
            color: white;
        }

        .dato {
            margin: 10px 0;
            font-size: 18px;
        }

    </style>

</head>


<body>

<div class="contenedor">

    <h1>🎃 Demon Fest</h1>

    <h2>📷 Escáner de entrada</h2>

    <p>Escanea el QR del boleto.</p>

    <div id="reader"></div>

    <div id="resultado"></div>

    <button
        id="marcarUsado"
        onclick="marcarComoUsado()"
    >
        ✅ MARCAR COMO USADO
    </button>

    <button
        id="nuevoEscaneo"
        onclick="nuevoEscaneo()"
    >
        📷 NUEVO ESCANEO
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript"
></script>

<script src="config.js"></script>


<script>


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let boletoActual = null;

let scanner = null;

let escaneando = false;
// ======================================================
// VERIFICAR SESIÓN DE ADMINISTRADOR
// ======================================================

async function verificarSesion() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        alert(
            "🔐 Debes iniciar sesión como administrador."
        );

        window.location.href = "admin.html";

        return false;
    }

    return true;
}

// ======================================================
// INICIAR
// ======================================================

verificarSesion().then(function(autorizado) {

    if (autorizado) {
        iniciarScanner();
    }

});

    scanner = new Html5Qrcode("reader");


    scanner.start(

        { facingMode: "environment" },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },


        function(codigo) {

            if (!escaneando) {
                return;
            }


            escaneando = false;


            verificarQR(codigo);

        },


        function(error) {

            // Errores normales mientras busca QR.
            // No hacemos nada.

        }

    )


    .then(function() {

        escaneando = true;

    })


    .catch(function(error) {

        console.error(
            "ERROR CAMARA:",
            error
        );


        mostrarError(
            "❌ NO SE PUDO ABRIR LA CÁMARA"
        );

    });




// ======================================================
// VERIFICAR QR
// ======================================================

async function verificarQR(codigo) {

    console.log(
        "QR LEÍDO:",
        codigo
    );

    try {

        if (scanner) {

            try {
                await scanner.stop();
            } catch (e) {}
        }


        // ==================================================
        // LEER TOKEN DEL QR
        // ==================================================

        const parametros =
            new URL(codigo);

        const token =
            parametros.searchParams.get("token");


        console.log(
            "TOKEN DEL QR:",
            token
        );


        if (!token) {

            mostrarError(
                "❌ QR NO VÁLIDO"
            );

            return;
        }


        // ==================================================
        // BUSCAR BOLETO POR TOKEN
        // ==================================================

        const { data, error } =
            await supabaseClient
                .rpc(
                    "obtener_boleto",
                    {
                        p_token: token
                    }
                );


        console.log(
            "DATA:",
            data
        );


        console.log(
            "ERROR:",
            error
        );


        // ==================================================
        // ERROR DE SUPABASE
        // ==================================================

        if (error) {

            console.error(
                "ERROR SUPABASE:",
                error
            );


            mostrarError(
                "❌ ERROR AL VERIFICAR BOLETO<br><br>" +
                error.message
            );


            return;
        }


        // ==================================================
        // BOLETO NO ENCONTRADO
        // ==================================================

        if (!data || data.length === 0) {

            mostrarError(
                "❌ BOLETO NO VÁLIDO"
            );

            return;
        }


        const boleto = data[0];

        boletoActual = boleto;


        // ==================================================
        // CAMPOS
        // ==================================================

        const nombre =
            boleto.nombre ??
            boleto.Nombre ??
            "";


        const cantidad =
            boleto.cantidad ??
            boleto.Cantidad ??
            "";


        const total =
            boleto.total ??
            boleto.Total ??
            "";


        const estado =
            boleto.estado ??
            boleto.Estado ??
            "";


        // ==================================================
        // BOLETO USADO
        // ==================================================

        if (estado === "Usado") {

            document.getElementById(
                "resultado"
            ).className =
                "resultado usado";


            document.getElementById(
                "resultado"
            ).innerHTML = `

                <h2>🚫 BOLETO YA UTILIZADO</h2>

                <div class="dato">
                    <strong>Boleto:</strong>
                    #${boleto.id}
                </div>

                <div class="dato">
                    <strong>Nombre:</strong>
                    ${nombre}
                </div>

                <p>
                    Este boleto ya fue registrado
                    en la entrada.
                </p>

            `;


            document.getElementById(
                "marcarUsado"
            ).style.display =
                "none";


            return;
        }


        // ==================================================
        // BOLETO CONFIRMADO
        // ==================================================

        if (estado === "Confirmado") {

            document.getElementById(
                "resultado"
            ).className =
                "resultado valido";


            document.getElementById(
                "resultado"
            ).innerHTML = `

                <h2>✅ BOLETO VÁLIDO</h2>

                <div class="dato">
                    <strong>Boleto:</strong>
                    #${boleto.id}
                </div>

                <div class="dato">
                    <strong>Nombre:</strong>
                    ${nombre}
                </div>

                <div class="dato">
                    <strong>Boletos:</strong>
                    ${cantidad}
                </div>

                <div class="dato">
                    <strong>Total:</strong>
                    $${total} MXN
                </div>

                <p>
                    🎃 ¡Puede entrar!
                </p>

            `;


            document.getElementById(
                "marcarUsado"
            ).style.display =
                "block";


            return;
        }


        mostrarError(
            "❌ BOLETO NO CONFIRMADO"
        );

    }

    catch (error) {

        console.error(
            "ERROR REAL:",
            error
        );


        mostrarError(
            "❌ ERROR DEL SCANNER<br><br>" +
            error.message
        );

    }

}
async function marcarComoUsado() {


    if (!boletoActual) {

        alert(
            "❌ No hay ningún boleto seleccionado."
        );

        return;
    }


    const confirmar =
        confirm(
            "¿Seguro que quieres marcar el boleto #" +
            boletoActual.id +
            " como USADO?"
        );


    if (!confirmar) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .rpc(
                "marcar_boleto_usado",
                {
                    p_id:
                        Number(
                            boletoActual.id
                        )
                }
            );


    console.log(
        "MARCAR USADO:",
        data
    );


    console.log(
        "ERROR:",
        error
    );


    if (error) {

        alert(
            "❌ Error al marcar el boleto:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ ¡Boleto marcado como USADO!"
    );


    const nombre =
        boletoActual.Nombre ??
        boletoActual.nombre ??
        "";


    document.getElementById(
        "resultado"
    ).className =
        "resultado usado";


    document.getElementById(
        "resultado"
    ).innerHTML = `

        <h2>🟢 BOLETO USADO</h2>

        <div class="dato">
            <strong>Boleto:</strong>
            #${boletoActual.id}
        </div>

        <div class="dato">
            <strong>Nombre:</strong>
            ${nombre}
        </div>

        <p>
            ✅ Entrada registrada correctamente.
        </p>

    `;


    document.getElementById(
        "marcarUsado"
    ).style.display =
        "none";

}


// ======================================================
// NUEVO ESCANEO
// ======================================================

async function nuevoEscaneo() {


    document.getElementById(
        "resultado"
    ).innerHTML = "";


    document.getElementById(
        "resultado"
    ).className = "";


    document.getElementById(
        "marcarUsado"
    ).style.display =
        "none";


    boletoActual = null;


    try {

        if (scanner) {

            await scanner.clear();

        }

    }

    catch (e) {}


    document.getElementById(
        "reader"
    ).innerHTML = "";


    iniciarScanner();

}


// ======================================================
// MOSTRAR ERROR
// ======================================================

function mostrarError(mensaje) {


    document.getElementById(
        "resultado"
    ).className =
        "resultado invalido";


    document.getElementById(
        "resultado"
    ).innerHTML = `

        <h2>${mensaje}</h2>

    `;

}


// ======================================================
// INICIAR
// ======================================================

iniciarScanner();


</script>

</body>

</html>
