<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Halloween Fest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 30px;
        }

        .login,
        .boleto {
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: #ff5e00;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .botonSecundario {
            background: #333;
        }

        .error {
            color: #ff5555;
            margin-top: 15px;
        }

        .boleto p {
            margin: 8px 0;
        }

        .seccion {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>🎃 ADMIN — HALLOWEEN FEST</h1>


    <!-- LOGIN -->

    <div class="login" id="login">

        <h2>🔐 Acceso administrador</h2>

        <br>

        <input
            id="email"
            type="email"
            placeholder="Correo"
        >

        <input
            id="password"
            type="password"
            placeholder="Contraseña"
        >

        <button onclick="iniciarSesion()">
            🔑 ENTRAR
        </button>

        <p id="errorLogin" class="error"></p>

    </div>


    <!-- PANEL -->

    <div id="panel" style="display:none;">

        <button
            class="botonSecundario"
            onclick="cerrarSesion()"
        >
            🚪 CERRAR SESIÓN
        </button>


        <!-- PENDIENTES -->

        <div class="seccion">

            <h2>🟡 Pagos pendientes</h2>

            <div id="listaPendientes">
                Cargando...
            </div>

        </div>


        <!-- CONFIRMADOS -->

        <div class="seccion">

            <h2>🟢 Boletos confirmados</h2>

            <div id="listaConfirmados">
                Cargando...
            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>


    <script>

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =========================
        // INICIAR SESIÓN
        // =========================

        async function iniciarSesion() {

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;


            if (!email || !password) {

                document.getElementById(
                    "errorLogin"
                ).textContent =
                    "Completa correo y contraseña.";

                return;
            }


            const { error } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (error) {

                console.error(error);

                document.getElementById(
                    "errorLogin"
                ).textContent =
                    "❌ Correo o contraseña incorrectos.";

                return;
            }


            document.getElementById(
                "login"
            ).style.display = "none";


            document.getElementById(
                "panel"
            ).style.display = "block";


            cargarBoletos();

        }



        // =========================
        // CARGAR BOLETOS
        // =========================

        async function cargarBoletos() {

            cargarPendientes();

            cargarConfirmados();

        }



        // =========================
        // PENDIENTES
        // =========================

        async function cargarPendientes() {

            const { data, error } =
                await supabaseClient

                    .from("Boletos")

                    .select("*")

                    .eq("Estado", "Pendiente")

                    .order("id", {
                        ascending: false
                    });


            const lista =
                document.getElementById(
                    "listaPendientes"
                );


            if (error) {

                console.error(error);

                lista.innerHTML =
                    "<p>❌ Error al cargar.</p>";

                return;
            }


            if (!data || data.length === 0) {

                lista.innerHTML =
                    "<p>✅ No hay pagos pendientes.</p>";

                return;
            }


            lista.innerHTML = "";


            data.forEach(boleto => {

                const div =
                    document.createElement("div");

                div.className = "boleto";


                div.innerHTML = `

                    <h2>
                        🎟️ Boleto #${boleto.id}
                    </h2>

                    <p>
                        <strong>Nombre:</strong>
                        ${boleto.Nombre}
                    </p>

                    <p>
                        <strong>Teléfono:</strong>
                        ${boleto.Telefono}
                    </p>

                    <p>
                        <strong>Cantidad:</strong>
                        ${boleto.Cantidad}
                    </p>

                    <p>
                        <strong>Total:</strong>
                        $${boleto.Total} MXN
                    </p>

                    <p>
                        <strong>Referencia:</strong>
                        ${boleto.Referencia}
                    </p>

                    <button
                        onclick="autorizar(${boleto.id})"
                    >
                        ✅ AUTORIZAR PAGO
                    </button>

                `;


                lista.appendChild(div);

            });

        }



        // =========================
        // AUTORIZAR
        // =========================

        async function autorizar(id) {

            const confirmar =
                confirm(
                    "¿Confirmaste que este pago ya fue recibido?"
                );


            if (!confirmar) {
                return;
            }


            const {
                data: boleto,
                error: errorBusqueda
            } = await supabaseClient

                .from("Boletos")

                .select("*")

                .eq("id", id)

                .single();


            if (errorBusqueda || !boleto) {

                alert(
                    "❌ No se pudo encontrar el boleto."
                );

                return;
            }


            const { error } =
                await supabaseClient

                    .from("Boletos")

                    .update({
                        Estado: "Confirmado"
                    })

                    .eq("id", id);


            if (error) {

                console.error(error);

                alert(
                    "❌ Error al autorizar."
                );

                return;
            }


            alert(
                "🎃 ¡Pago autorizado!"
            );


            enviarWhatsApp(boleto);


            cargarBoletos();

        }



        // =========================
        // REENVIAR BOLETO
        // =========================

        function enviarWhatsApp(boleto) {

            const boletoUrl =
    "https://yedrix26.github.io/Halloween-Fest/ticket.html?id=" + boleto.id;


            let telefono =
                String(boleto.Telefono)
                    .replace(/\D/g, "");


            // Si el número tiene 10 dígitos,
            // agregamos México

            if (telefono.length === 10) {
                telefono = "52" + telefono;
            }


            const mensaje =
                "🎃 ¡Tu boleto para Halloween Fest está confirmado!%0A%0A" +

                "🎟️ Boleto #" +
                boleto.id +
                "%0A" +

                "👤 Nombre: " +
                boleto.Nombre +
                "%0A" +

                "🎫 Cantidad: " +
                boleto.Cantidad +
                "%0A%0A" +

                "👉 ABRIR MI BOLETO:%0A" +

                boletoUrl;


            window.open(
                "https://wa.me/" +
                telefono +
                "?text=" +
                mensaje,
                "_blank"
            );

        }



        // =========================
        // CONFIRMADOS
        // =========================

        async function cargarConfirmados() {

            const {
                data,
                error
            } = await supabaseClient

                .from("Boletos")

                .select("*")

                .eq("Estado", "Confirmado")

                .order("id", {
                    ascending: false
                });


            const lista =
                document.getElementById(
                    "listaConfirmados"
                );


            if (error) {

                console.error(error);

                lista.innerHTML =
                    "<p>❌ Error al cargar.</p>";

                return;
            }


            if (!data || data.length === 0) {

                lista.innerHTML =
                    "<p>No hay boletos confirmados.</p>";

                return;
            }


            lista.innerHTML = "";


            data.forEach(boleto => {

                const div =
                    document.createElement("div");

                div.className = "boleto";


                div.innerHTML = `

                    <h2>
                        🎟️ Boleto #${boleto.id}
                    </h2>

                    <p>
                        <strong>Nombre:</strong>
                        ${boleto.Nombre}
                    </p>

                    <p>
                        <strong>Teléfono:</strong>
                        ${boleto.Telefono}
                    </p>

                    <p>
                        <strong>Cantidad:</strong>
                        ${boleto.Cantidad}
                    </p>

                    <p>
                        <strong>Referencia:</strong>
                        ${boleto.Referencia}
                    </p>

                    <button
                        onclick='reenviar(${JSON.stringify(boleto)})'
                    >
                        📲 REENVIAR BOLETO
                    </button>

                `;


                lista.appendChild(div);

            });

        }



        // =========================
        // REENVIAR
        // =========================

        function reenviar(boleto) {

            enviarWhatsApp(boleto);

        }



        // =========================
        // CERRAR SESIÓN
        // =========================

        async function cerrarSesion() {

            await supabaseClient.auth.signOut();

            location.reload();

        }

    </script>

</body>
</html>
